[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ds-production-reference"
version = "0.1.0"
description = "Titanic survival: from Jupyter notebook to production API — course reference repo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "mlflow>=2.22",
    "joblib>=1.3",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/titanic_prod"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
