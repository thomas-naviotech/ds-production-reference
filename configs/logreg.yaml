# Pluggable run config: logistic regression baseline.
# Swap the file (not the code) to run a different model: see rf.yaml.
seed: 42
target: "Survived"

paths:
  raw_csv: "data/raw/Titanic-Dataset.csv"
  processed_csv: "data/processed/titanic_features.csv"
  artifacts_dir: "artifacts"
  mlflow_uri: "sqlite:///mlruns/mlflow.db"
  mlflow_experiment: "titanic-survival"

split:
  test_size: 0.2
  stratify: true

model:
  name: "logreg"
  params:
    max_iter: 1000
