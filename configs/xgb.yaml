# Pluggable run config: XGBoost challenger (same schema as logreg.yaml).
# Needs `uv pip install xgboost` first; compare.py skips it gracefully if missing.
seed: 42
target: "Survived"

paths:
  raw_csv: "data/raw/Titanic-Dataset.csv"
  processed_csv: "data/processed/titanic_features.csv"
  artifacts_dir: "artifacts"
  mlflow_uri: "sqlite:///mlruns/mlflow.db"
  mlflow_experiment: "titanic-survival"

split:
  test_size: 0.2
  stratify: true

model:
  name: "xgb"
  params:
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.05
