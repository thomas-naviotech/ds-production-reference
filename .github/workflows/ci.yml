name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Tests
        run: uv run pytest -q

      - name: Train smoke test (logreg)
        run: uv run python scripts/train.py --config configs/logreg.yaml
